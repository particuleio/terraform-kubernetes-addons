name: Pre-Commit

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  collectInputs:
    name: Collect workflow inputs
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.dirs.outputs.directories }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get root directories
        id: dirs
        uses: clowdhaus/terraform-composite-actions/directories@v1.14.0

  preCommitMinVersions:
    name: Min TF pre-commit
    needs: collectInputs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.collectInputs.outputs.directories) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform min/max versions
        id: minMax
        uses: clowdhaus/terraform-min-max@v3.0.1
        with:
          directory: ${{ matrix.directory }}

      - name: Override Terraform version with the minimum supported one
        run: echo "MISE_TERRAFORM_VERSION=${{ steps.minMax.outputs.minVersion }}" >> "$GITHUB_ENV"

      - name: Install tools
        uses: jdx/mise-action@v5.2.2
        with:
          cache_key_prefix: mise-tf-min

      - name: Pre-commit Terraform ${{ steps.minMax.outputs.minVersion }}
        # Run only validate pre-commit check on min version supported
        if: ${{ matrix.directory !=  '.' }}
        run: pre-commit run terraform_validate --color=always --show-diff-on-failure --files ${{ matrix.directory }}/*

      - name: Pre-commit Terraform ${{ steps.minMax.outputs.minVersion }}
        # Run only validate pre-commit check on min version supported
        if: ${{ matrix.directory ==  '.' }}
        run: pre-commit run terraform_validate --color=always --show-diff-on-failure --files ./*.tf

  preCommitMaxVersion:
    name: Max TF pre-commit
    runs-on: ubuntu-latest
    needs: collectInputs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Install tools
        uses: jdx/mise-action@v5.2.2

      - name: Pre-commit Terraform
        run: pre-commit run --color=always --show-diff-on-failure --all-files
